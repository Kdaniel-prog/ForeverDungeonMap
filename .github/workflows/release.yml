# Releases ForeverDungeonMap to CurseForge (and as a GitHub release) without manual steps.
#
# How a release happens: the top version heading of CHANGELOG.md, e.g. "## 0.7.1 (unreleased)",
# loses its "(unreleased)" and is pushed to main. This workflow then tags that version (v0.7.1),
# builds the zip with BigWigsMods/packager (the tag becomes "## Version") and uploads it.
# Pushing a version tag by hand (v0.7.2) releases as well. A heading still marked
# "(unreleased)", or a version already tagged, releases nothing.
#
# Repository settings the owner fills in once (Settings > Secrets and variables > Actions):
#   secret   CF_API_KEY               CurseForge API token (https://authors.curseforge.com/account/api-tokens)
#   variable CURSEFORGE_PROJECT_ID    the CurseForge project id (About This Project on the project page)
#   variable CURSEFORGE_GAME_VERSION  optional: the game version CurseForge lists for WoW Forever;
#                                     without it the packager maps "## Interface: 16001"
#   secret   WAGO_API_TOKEN           optional, for Wago Addons (also set "-a <wago id>" below)
name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On main: the newest CHANGELOG version, released unless still "(unreleased)" or tagged.
      - name: Decide what to release
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heading=$(grep -m1 '^## ' CHANGELOG.md)
          version=$(echo "$heading" | sed -E 's/^## v?([0-9][^ ]*).*/\1/')
          if echo "$heading" | grep -qi 'unreleased'; then
            echo "Top of CHANGELOG.md is unreleased ($heading): nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v$version"
            git push origin "v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The packager reads .pkgmeta and the changelog from its top directory (the addon folder).
      - name: Put the packager files next to the addon
        if: steps.version.outputs.release == 'true'
        run: cp .pkgmeta CHANGELOG.md ForeverDungeonMap/

      - name: Package and upload
        if: steps.version.outputs.release == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: >-
            -t ForeverDungeonMap
            ${{ vars.CURSEFORGE_PROJECT_ID && format('-p {0}', vars.CURSEFORGE_PROJECT_ID) || '' }}
            ${{ vars.CURSEFORGE_GAME_VERSION && format('-g {0}', vars.CURSEFORGE_GAME_VERSION) || '' }}
